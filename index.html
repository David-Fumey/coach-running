<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1322" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <script>
      // Applique le thème choisi avant l'affichage, pour éviter un flash.
      try {
        var t = JSON.parse(localStorage.getItem("foulee.theme.v1"));
        if (t === "clair" || t === "sombre") document.documentElement.setAttribute("data-theme", t === "clair" ? "light" : "dark");
      } catch (e) {}
    </script>
    <title>Runner – plan de course</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
